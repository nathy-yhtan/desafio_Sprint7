<div class="tudo">


    <div>

        <!--menu-->
        <button class="botao-menu-fixo" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample"
            aria-controls="offcanvasExample" [style.display]="'flex'" (click)="isMenuAberto = true">
            <svg xmlns="http://w3.org" width="24" height="24" fill="currentColor" class="bi bi-list"
                viewBox="0 0 16 16">
                <path fill-rule="evenodd"
                    d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5" />
            </svg>
            <span>Menu</span>
        </button>

        <!--abriu menu-->
        <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample"
            aria-labelledby="offcanvasExampleLabel">
            <div class="offcanvas-header">
                <img src="/img/ford.png" alt="logo-ford">
                <h5 class="offcanvas-title" id="offcanvasExampleLabel">Home</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"
                    (click)="isMenuAberto = false"></button>
            </div>
            <div class="offcanvas-body">
                <div class="d-grid gap-2">
                    <button class="btn btn-primary" (click)="goToDashboard()">
                        Dashboard
                    </button>
                    <button (click)="logout()" class="btn btn-danger">Sair</button>
                </div>
            </div>
        </div>

    </div>

    <div>

        <div class="cartao-sistema">

            <div class="cartao-topo">

                Sistema de dados FORD

            </div>

            <div class="cartao-corpo">

                <h1>Seja bem vindo(a)!</h1>
                <br>
                <h5>Orientações:</h5>
                <br>
                <h6>Para vizualizar os dados, ou deslogar, aperte os respectivos botões que se encontram no "Menu".</h6>

                <!--add mais coisa se quiser-->

            </div>

        </div>

    </div>


</div>
