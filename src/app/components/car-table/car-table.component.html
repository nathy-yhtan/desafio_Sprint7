<div class="table-responsive shadow-sm border rounded mx-auto my-4 w-100" style="max-width: 100%;">
    <table class="table table-striped table-hover align-middle mb-0 text-center w-100">
        <thead>
            <tr class="custom-header">
                <th class="p-3 text-white text-uppercase fw-bold border-0 text-start" style="min-width: 180px;">VIN</th>
                <th class="p-3 text-white text-uppercase fw-bold border-0" style="min-width: 110px;">Odômetro</th>
                <th class="p-3 text-white text-uppercase fw-bold border-0" style="min-width: 160px;">Nível do Combustível</th>
                <th class="p-3 text-white text-uppercase fw-bold border-0" style="min-width: 110px;">Status</th>
                <th class="p-3 text-white text-uppercase fw-bold border-0" style="min-width: 110px;">Lat</th>
                <th class="p-3 text-white text-uppercase fw-bold border-0" style="min-width: 110px;">Long</th>
            </tr>
        </thead>
        <tbody class="bg-white">
            <tr>
                <td class="p-3 text-start">
                    <div class="input-group w-100" style="max-width: 260px;">
                        <input (change)="onChangeVin($event)" type="text"
                            class="form-control border-end-0 font-monospace text-truncate" placeholder="{{ vin }}" value="{{ vin }}">
                        <button class="btn btn-primary px-3" type="button">
                            <svg xmlns="http://w3.org" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                                <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04.062.078.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1.007 1.007 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0z"/>
                            </svg>
                        </button>
                    </div>
                </td>
                <td class="p-3 fw-semibold text-secondary">{{odometro}} Km</td>
                <td class="p-3 fw-semibold text-secondary">{{nivelCombustivel}}%</td>
                <td class="p-3 fw-semibold text-secondary">
                    <span class="badge bg-dark px-2 py-1 fs-6 fw-normal">{{status}}</span>
                </td>
                <td class="p-3 fw-semibold text-secondary">{{lat}}</td>
                <td class="p-3 fw-semibold text-secondary">{{long}}</td>
            </tr>
        </tbody>
    </table>
</div>
